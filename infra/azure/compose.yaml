# Servidor central del piloto (Azure). Solo Caddy publica puertos (80/443, HTTPS automático).
# backend y web vienen de GHCR, publicadas por CI desde main; autodeploy.sh las actualiza.
# El servidor no compila.
name: vigia

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      VIGIA_DOMAIN: ${VIGIA_DOMAIN:?Define VIGIA_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./descargas:/srv/descargas:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on: [web, backend]

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${VIGIA_DB_PASSWORD:?Define VIGIA_DB_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # Small server (1 GB RAM): keep Postgres frugal.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ghcr.io/cfvizcaino/vigia-backend:${VIGIA_IMAGE_TAG:-main}
    environment:
      DATABASE_URL: postgresql+psycopg://vigia:${VIGIA_DB_PASSWORD}@db:5432/vigia
      INGEST_AUTH_MODE: device
      CORS_ORIGINS: https://${VIGIA_DOMAIN}
      USER_SESSION_HOURS: "8"
      # Two Uvicorn processes for the 2 vCPU. Per process: up to 20 requests at a time
      # (the rest get 503 at once) and 5+5 connections that wait at most 5 s (overload.py).
      WEB_CONCURRENCY: "2"
      # Uvicorn restarts a worker that does not answer its supervisor within 5 s. At
      # 100 msg/s on 2 vCPU a busy worker missed it and was killed (22 × 502 in the
      # benchmark rerun of 12/10). Overload is handled by the 503 shedding; give the
      # supervisor ping time. A truly hung process is still caught by the watchdog.
      UVICORN_TIMEOUT_WORKER_HEALTHCHECK: "30"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/cfvizcaino/vigia-web:${VIGIA_IMAGE_TAG:-main}
    environment:
      BACKEND_API_URL: http://backend:8000
      ROAD_ROUTER_URL: http://osrm:5000
      # Behind Caddy the app sees plain HTTP: force Secure cookies explicitly.
      SESSION_COOKIE_SECURE: "true"
    restart: unless-stopped
    depends_on: [backend]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./osrm:/data:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  backend-data:
