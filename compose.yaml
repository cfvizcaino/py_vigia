services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      # Defined in the root .env (ignored by Git); see docs/operations/postgres.md.
      POSTGRES_PASSWORD: ${VIGIA_DB_PASSWORD:?Define VIGIA_DB_PASSWORD en .env (ver docs/operations/postgres.md)}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vigia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    image: vigia/backend:local
    build:
      context: ./apps/backend
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vigia:${VIGIA_DB_PASSWORD}@db:5432/vigia
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vigia-backend-data:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    image: vigia/web:local
    build:
      context: ./apps/web
    environment:
      BACKEND_API_URL: http://backend:8000
      VISION_API_URL: http://vision:8001
      ROAD_ROUTER_URL: ${ROAD_ROUTER_URL:-http://osrm:5000}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

  # Synthetic scoring dataset, isolated from pilot data (docs/operations/scoring-dataset.md).
  backend-scoring:
    profiles: ["scoring"]
    image: vigia/backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://vigia:${VIGIA_DB_PASSWORD}@db:5432/vigia_scoring
    ports:
      - "127.0.0.1:8200:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web-scoring:
    profiles: ["scoring"]
    image: vigia/web:local
    environment:
      BACKEND_API_URL: http://backend-scoring:8000
      ROAD_ROUTER_URL: ${ROAD_ROUTER_URL:-http://osrm:5000}
      # Cookies ignore the port: a distinct name keeps both consoles signed in.
      SESSION_COOKIE_NAME: vigia_scoring_session
    ports:
      - "127.0.0.1:3200:3000"
    restart: unless-stopped
    depends_on:
      - backend-scoring

  vision:
    profiles: ["vision"]
    build:
      context: ./apps/vision
    env_file:
      - path: ./apps/vision/.env
        required: false
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./apps/vision/outputs:/app/outputs
    environment:
      VIGIA_CENTRAL_API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  osrm:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./infra/osrm/data:/data:ro,z
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

volumes:
  vigia-backend-data:
  vigia-postgres-data:
