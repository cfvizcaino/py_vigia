services:
  web:
    build:
      context: ./apps/web
    environment:
      VISION_API_URL: http://vision:8001
    ports:
      - "3000:3000"
    restart: unless-stopped

  vision:
    profiles: ["vision"]
    build:
      context: ./apps/vision
    env_file:
      - path: ./apps/vision/.env
        required: false
    ports:
      - "8001:8001"
    volumes:
      - ./apps/vision/outputs:/app/outputs
    restart: unless-stopped
