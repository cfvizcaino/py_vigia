# React Native mobile builds; Android is the current acceptance target.
name: movil

on:
  pull_request:
    paths:
      - "apps/movil-rn/**"
      - "apps/movil/**"
      - "packages/contracts/detection-envelope-1.1.schema.json"
      - ".github/workflows/movil.yml"
  push:
    branches: [main]
    paths:
      - "apps/movil-rn/**"
      - "apps/movil/**"
      - "packages/contracts/detection-envelope-1.1.schema.json"
      - ".github/workflows/movil.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/movil-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/movil-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run doctor
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-android-debug
          path: apps/movil-rn/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios-unsigned:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/movil-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/movil-rn/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Build iOS without signing
        shell: bash
        run: |
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          scheme="$(xcodebuild -list -json -project "$project" | jq -r '.project.schemes[0]')"
          xcodebuild \
            -project "$project" \
            -scheme "$scheme" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent "$app" ios/build/Vigia-iOS-sin-firma.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-ios-unsigned
          path: apps/movil-rn/ios/build/Vigia-iOS-sin-firma.zip
          retention-days: 14
