# App móvil: la app React Native (apps/movil-rn) y, mientras siga en producción,
# la app Flutter (apps/movil). Los APK de distribución se firman en el equipo del
# proyecto (la llave no está en GitHub); aquí se verifica que todo compile y se
# dejan artefactos de prueba descargables, firmados con la llave de depuración.
name: movil

on:
  pull_request:
    paths:
      - "apps/movil-rn/**"
      - "apps/movil/**"
      - "packages/contracts/detection-envelope-1.1.schema.json"
      - ".github/workflows/movil.yml"
  push:
    branches: [main]
    paths:
      - "apps/movil-rn/**"
      - "apps/movil/**"
      - "packages/contracts/detection-envelope-1.1.schema.json"
      - ".github/workflows/movil.yml"
  workflow_dispatch:
    inputs:
      run_android_e2e:
        description: "Ejecutar flujos Maestro en emulador Android"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: movil-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  FLUTTER_VERSION: "3.47.7"
  VIGIA_DEFAULT_API: https://vigia-5dfe.mexicocentral.cloudapp.azure.com
  # La app RN toma el servidor por defecto de esta variable al empaquetar el JS.
  EXPO_PUBLIC_VIGIA_DEFAULT_API: https://vigia-5dfe.mexicocentral.cloudapp.azure.com

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/movil-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/movil-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npx expo prebuild --clean --platform android --no-install
      - name: Pruebas JVM del módulo nativo
        run: cd android && ./gradlew :vigia-camera-server:testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.parallel=false
      # Release con el JS empaquetado (no necesita Metro); sin llave, firma de depuración.
      # x86_64 va incluido para que el APK corra en el emulador de los flujos Maestro.
      - name: APK de prueba
        run: cd android && ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-rn-android-prueba
          path: apps/movil-rn/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/movil-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/movil-rn/package-lock.json
      - run: npm ci
      # prebuild instala los pods, así que el proyecto se compila desde el .xcworkspace.
      - run: npx expo prebuild --clean --platform ios
      - name: Compilar para iPhone sin firma
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"
          test -n "$workspace" || { echo "No se encontró el workspace iOS de la app" >&2; exit 1; }
          test -n "$project" || { echo "No se encontró el proyecto Xcode de la app" >&2; exit 1; }
          # El primer scheme del workspace puede ser de una dependencia (compila en un
          # minuto y no produce .app): se usa el scheme compartido del proyecto de la app.
          scheme_file="$(find "$project/xcshareddata/xcschemes" -maxdepth 1 -name '*.xcscheme' -print -quit)"
          test -n "$scheme_file" || { echo "No se encontró el scheme iOS compartido de la app" >&2; exit 1; }
          scheme="$(basename "$scheme_file" .xcscheme)"
          echo "Compilando scheme de la app: $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "La compilación no produjo el .app esperado" >&2; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" ios/build/Vigia-iOS-sin-firma.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-rn-ios-sin-firma
          path: apps/movil-rn/ios/build/Vigia-iOS-sin-firma.zip
          if-no-files-found: error
          retention-days: 14

  android-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_e2e == true
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vigia-rn-android-prueba
          path: artifacts
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install artifacts/app-release.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro test apps/movil-rn/.maestro/flows

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: APK de prueba (firma de depuración)
        run: flutter build apk --release --dart-define=VIGIA_DEFAULT_API=$VIGIA_DEFAULT_API
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-android-prueba
          path: apps/movil/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  flutter-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para iPhone sin firma
        run: flutter build ios --release --no-codesign --dart-define=VIGIA_DEFAULT_API=$VIGIA_DEFAULT_API
      - name: Empaquetar Runner.app
        run: cd build/ios/iphoneos && zip -qry Runner-sin-firma.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: vigia-ios-sin-firma
          path: apps/movil/build/ios/iphoneos/Runner-sin-firma.zip
          retention-days: 14
